name: Build

on:
  push:
    branches: [main, reliability]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MonitorControl (ad-hoc signed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project MonitorControl.xcodeproj -scheme MonitorControl

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MonitorControl.xcodeproj \
            -scheme MonitorControl \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            > build.log 2>&1 || { echo "::group::errors"; grep -E "error:|\*\* BUILD FAILED" build.log || true; echo "::endgroup::"; tail -n 80 build.log; exit 1; }
          test -d "$RUNNER_TEMP/DerivedData/Build/Products/Release/MonitorControl.app"

      - name: Ad-hoc sign
        # macOS will not grant Accessibility permission to a completely unsigned app; an ad-hoc signature is enough for personal use.
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/MonitorControl.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          cd "$RUNNER_TEMP/DerivedData/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent MonitorControl.app MonitorControl.zip
          shasum -a 256 MonitorControl.zip | tee MonitorControl.zip.sha256

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MonitorControl-${{ github.ref_name }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip.sha256
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip.sha256
          generate_release_notes: true
