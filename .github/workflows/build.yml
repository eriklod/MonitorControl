name: Build

on:
  push:
    branches: [main, reliability]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MonitorControl
    runs-on: macos-15
    env:
      # Set the secrets MAC_SIGNING_CERT_P12 (base64 of a .p12 export of a self-signed "Code Signing" certificate) and
      # MAC_SIGNING_CERT_PASSWORD in the repository to get a stable signature. macOS ties the Accessibility permission to
      # the signing certificate; with a stable one the permission survives updates. Without the secrets the app is ad-hoc
      # signed, which means the permission has to be granted again after every build.
      HAS_SIGNING_CERT: ${{ secrets.MAC_SIGNING_CERT_P12 != '' && secrets.MAC_SIGNING_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_CERT_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/signing.p12"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not trusted on the runner; trust it for code signing so codesign accepts it.
          openssl pkcs12 -in "$P12" -passin "pass:$P12_PASSWORD" -clcerts -nokeys -out "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          test -n "$IDENTITY"
          echo "Signing identity: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$P12"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project MonitorControl.xcodeproj -scheme MonitorControl

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MonitorControl.xcodeproj \
            -scheme MonitorControl \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            > build.log 2>&1 || { echo "::group::errors"; grep -E "error:|\*\* BUILD FAILED" build.log || true; echo "::endgroup::"; tail -n 80 build.log; exit 1; }
          test -d "$RUNNER_TEMP/DerivedData/Build/Products/Release/MonitorControl.app"

      - name: Sign
        # macOS will not grant Accessibility permission to a completely unsigned app. A stable self-signed certificate is
        # preferred (see HAS_SIGNING_CERT above); otherwise fall back to an ad-hoc signature.
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/MonitorControl.app"
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            echo "Signing with certificate: $SIGN_IDENTITY"
            codesign --force --deep --sign "$SIGN_IDENTITY" --entitlements MonitorControl/MonitorControl.entitlements "$APP"
          else
            echo "No signing certificate configured, using an ad-hoc signature."
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP" 2>&1 | grep -E "designated|Authority" || true

      - name: Package
        run: |
          cd "$RUNNER_TEMP/DerivedData/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent MonitorControl.app MonitorControl.zip
          shasum -a 256 MonitorControl.zip | tee MonitorControl.zip.sha256

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MonitorControl-${{ github.ref_name }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip.sha256
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip
            ${{ runner.temp }}/DerivedData/Build/Products/Release/MonitorControl.zip.sha256
          generate_release_notes: true
